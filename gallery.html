<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bristle — Gallery</title>
    <meta name="description" content="Navigation trajectory clips extracted from house tour videos, with per-clip metadata.">
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="masthead">
    <h1><a href="./">Bristle</a></h1>
    <p>real-world navigation trajectories from house tour videos</p>
</header>
<nav class="bar">
    <ul>
        <li><a href="./">overview</a></li>
        <li><a href="explorer.html">explorer</a></li>
        <li><a class="here" href="gallery.html">gallery</a></li>
        <li><a href="https://andyye.bio/cs/research/robotics/bristle">write-up</a></li>
    </ul>
</nav>

<main class="wide">
    <div class="pagehead">
        <h2>gallery</h2>
        <p class="mono">
            <span id="stats"></span>
            <label>sort
                <select id="sort">
                    <option value="shuffled">shuffled</option>
                    <option value="trajectory_length_m">longest path</option>
                    <option value="duration_s">longest clip</option>
                </select>
            </label>
        </p>
    </div>
    <p class="lede">Extracted trajectory clips that passed the visual filter. Click one for its numbers.</p>

    <div class="grid" id="grid">
        <p class="note">loading clips…</p>
    </div>
</main>

<dialog id="modal">
    <div class="inner">
        <div class="frame"><video id="modal-video" controls autoplay loop muted playsinline></video></div>
        <div class="bar">
            <h3 id="modal-title"></h3>
            <button type="button" id="modal-close">close</button>
        </div>
        <dl class="meta" id="modal-meta"></dl>
        <p class="reason" id="modal-reason"></p>
    </div>
</dialog>

<footer><a href="https://andyye.bio/site">andy ye</a> · uw raivn · ai2</footer>

<script>
    const grid = document.getElementById('grid');
    const stats = document.getElementById('stats');
    const sortEl = document.getElementById('sort');
    const modal = document.getElementById('modal');
    const modalVideo = document.getElementById('modal-video');
    const modalTitle = document.getElementById('modal-title');
    const modalMeta = document.getElementById('modal-meta');
    const modalReason = document.getElementById('modal-reason');
    const FLAGS = [['is_stairs', 'stairs'], ['is_outdoor', 'outdoor'], ['is_people', 'people'], ['is_water', 'water']];
    let metadata = {};
    let shuffled = [];

    function fmtNum(n, d = 2) { return n != null ? Number(n).toFixed(d) : '–'; }

    function seededShuffle(arr, seed) {
        function rand() {
            seed = (seed * 16807 + 0) % 2147483647;
            return (seed - 1) / 2147483646;
        }
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(rand() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    function openModal(v) {
        modalVideo.src = v.url;
        modalTitle.textContent = v.name;
        const m = metadata[v.name];
        modalReason.textContent = '';
        if (m) {
            const rows = [
                ['path', fmtNum(m.trajectory_length_m) + ' m'],
                ['displacement', fmtNum(m.displacement_m) + ' m'],
                ['horiz. displ.', fmtNum(m.displacement_horizontal_m) + ' m'],
                ['vert. displ.', fmtNum(m.displacement_vertical_m) + ' m'],
                ['duration', fmtNum(m.duration_s, 1) + ' s'],
                ['keyframes', m.num_frames],
                ['avg speed', fmtNum(m.mean_speed_mps) + ' m/s'],
                ['median depth', fmtNum(m.median_depth_m) + ' m'],
                ['outdoor', m.is_outdoor ? 'yes' : 'no'],
                ['stairs', m.is_stairs ? 'yes' : 'no'],
                ['people', m.is_people ? 'yes' : 'no'],
            ];
            modalMeta.innerHTML = rows.map(([label, val]) => `<div><dt>${label}</dt><dd>${val}</dd></div>`).join('');
            if (m.reason) {
                const who = document.createElement('span');
                who.textContent = 'filter note (qwen-vl): ';
                modalReason.append(who, m.reason);
            }
        } else {
            modalMeta.innerHTML = '<div class="full"><dt>no metadata</dt><dd></dd></div>';
        }
        modal.showModal();
    }

    // fires for the close button, Escape, and backdrop clicks alike
    modal.addEventListener('close', () => {
        modalVideo.pause();
        modalVideo.removeAttribute('src');
        modalVideo.load();
    });
    modal.addEventListener('click', e => { if (e.target === modal) modal.close(); });
    document.getElementById('modal-close').addEventListener('click', () => modal.close());

    // clips load when they come near the viewport and only play while on screen
    const observer = new IntersectionObserver((entries) => {
        entries.forEach(e => {
            const video = e.target;
            if (e.isIntersecting) {
                if (!video.src) video.src = video.dataset.src;
                video.play().catch(() => {});
            } else {
                video.pause();
            }
        });
    }, { rootMargin: '200px' });

    function renderGrid(videos) {
        observer.disconnect();
        grid.innerHTML = '';
        stats.textContent = `${videos.length} clips`;

        videos.forEach(v => {
            const card = document.createElement('button');
            card.type = 'button';
            card.className = 'card';
            const m = metadata[v.name];
            const tagsHtml = m ? FLAGS.filter(([key]) => m[key]).map(([, label]) => `<span class="tag">${label}</span>`).join('') : '';
            card.innerHTML = `
                <video data-src="${v.url}" muted loop playsinline preload="metadata"></video>
                <span class="info mono">
                    <b>${v.name}</b>
                    ${m ? `<span>${fmtNum(m.trajectory_length_m)} m · ${fmtNum(m.duration_s, 1)} s</span>` : ''}
                </span>
                ${tagsHtml ? `<span class="tags">${tagsHtml}</span>` : ''}
            `;
            card.addEventListener('click', () => openModal(v));
            grid.appendChild(card);
            observer.observe(card.querySelector('video'));
        });

        if (videos.length === 0) {
            grid.innerHTML = '<p class="note">no clips</p>';
        }
    }

    sortEl.addEventListener('change', () => {
        const key = sortEl.value;
        if (key === 'shuffled') { renderGrid(shuffled); return; }
        const value = v => (metadata[v.name] || {})[key] || 0;
        renderGrid([...shuffled].sort((a, b) => value(b) - value(a)));
    });

    Promise.all([
        fetch('videos.json').then(r => r.json()),
        fetch('metadata.json').then(r => r.json()).catch(() => ({}))
    ]).then(([videos, meta]) => {
        metadata = meta;
        let seed = localStorage.getItem('bristle-seed');
        if (!seed) {
            seed = Math.floor(Math.random() * 2147483646) + 1;
            localStorage.setItem('bristle-seed', seed);
        }
        shuffled = seededShuffle(videos, Number(seed));
        renderGrid(shuffled);
    }).catch(err => {
        grid.innerHTML = '<p class="note">couldn’t load videos.json</p>';
        console.error(err);
    });
</script>
</body>
</html>
